<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Exortium Marketing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page-simple">
    <header class="top-nav">
      <a class="brand" href="./index.html">Exortium</a>
      <nav class="top-nav__links" aria-label="Pages">
        <a href="./index.html">Home</a>
        <a href="./services.html">Services</a>
        <a href="./testimonials.html">Testimonials</a>
        <a href="./about.html">About</a>
        <a href="./contact.html">Contact</a>
      </nav>
    </header>
    <main class="page-main">
      <p class="eyebrow">Contact Detail</p>
      <h1>Start Your Next Campaign</h1>
      <article class="page-card">
        <p>
          Share your goal and timeline and we will return with a recommended campaign path.
        </p>
      </article>
      <form class="contact-form contact-form--light">
        <label>
          Name
          <input type="text" name="name" placeholder="Your name" required />
        </label>
        <label>
          Email
          <input type="email" name="email" placeholder="you@company.com" required />
        </label>
        <label>
          Purpose
          <select name="purpose" required>
            <option value="" selected disabled>Select a purpose</option>
            <option>Website project</option>
            <option>Social media marketing</option>
            <option>Ad campaigns</option>
            <option>Lead generation</option>
            <option>Other</option>
          </select>
        </label>
        <label>
          Message
          <textarea name="message" rows="4" placeholder="Brief details"></textarea>
        </label>
        <button type="submit">Send Request</button>
      </form>
    </main>
  </body>
</html>
